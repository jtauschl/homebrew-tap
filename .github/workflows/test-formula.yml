name: Test Formula

on:
  pull_request:
  workflow_dispatch:

jobs:
  install-and-verify:
    # macos-latest/macos-15-intel cost real CI minutes. Gated to PRs (where
    # the automated version-bump PR, or a manual Formula edit, is actually
    # reviewed) and manual dispatch -- not every push to main -- since a
    # direct push here only ever follows an already-tested PR merge.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (ARM64)
            arch: arm64
          - os: macos-15-intel # last available Intel (x86_64) image; retires ~Aug 2027
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Style-check the Formula
        run: brew style --formula Formula/openproject-ce-mcp.rb

      - name: Audit the Formula
        run: brew audit --formula --strict Formula/openproject-ce-mcp.rb

      - name: Tap this checkout and install from source
        run: |
          brew tap-new jtauschl/local-ci-tap --no-git
          cp Formula/openproject-ce-mcp.rb "$(brew --repo jtauschl/local-ci-tap)/Formula/"
          brew install --build-from-source jtauschl/local-ci-tap/openproject-ce-mcp

      - name: Run the Formula's own test block
        run: brew test jtauschl/local-ci-tap/openproject-ce-mcp

      - name: Verify --version, configure --help, doctor --help
        run: |
          openproject-ce-mcp --version
          openproject-ce-mcp configure --help
          openproject-ce-mcp doctor --help

      - name: Verify no unpinned network install step exists
        # virtualenv_install_with_resources installs exclusively from the
        # pinned `resource` blocks already fetched above -- no further
        # network access should happen once the resources are staged. This
        # is a static check on the Formula's own install method, not a
        # runtime network-block (a real network-block would also catch
        # Homebrew's own legitimate bottle/resource fetches, giving a false
        # positive).
        run: |
          if grep -qE '(^|[^a-zA-Z_])(pip install|system\s+"pip")' Formula/openproject-ce-mcp.rb; then
            echo "::error::Formula contains a bare pip/system pip install step outside virtualenv_install_with_resources" >&2
            exit 1
          fi

      - name: Uninstall
        run: brew uninstall jtauschl/local-ci-tap/openproject-ce-mcp

  upgrade-flow:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve the previous published version
        id: previous
        run: |
          current_version="$(grep -m1 -oE 'openproject_ce_mcp-[0-9.]+\.tar\.gz' Formula/openproject-ce-mcp.rb | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          all_versions="$(curl -sf https://pypi.org/pypi/openproject-ce-mcp/json | python3 -c 'import json, sys; print(" ".join(sorted(json.load(sys.stdin)["releases"], key=lambda v: tuple(map(int, v.split(".")))))))')"
          previous_version=""
          for v in $all_versions; do
            if [ "$v" = "$current_version" ]; then
              break
            fi
            previous_version="$v"
          done
          if [ -z "$previous_version" ]; then
            echo "::error::No published version older than $current_version found on PyPI" >&2
            exit 1
          fi
          echo "previous_version=$previous_version" >> "$GITHUB_OUTPUT"

      - name: Install the previous version
        run: |
          brew tap-new jtauschl/local-ci-tap --no-git
          local_tap_formula="$(brew --repo jtauschl/local-ci-tap)/Formula/openproject-ce-mcp.rb"
          cp Formula/openproject-ce-mcp.rb "$local_tap_formula"
          sha256="$(curl -sf "https://pypi.org/pypi/openproject-ce-mcp/${{ steps.previous.outputs.previous_version }}/json" \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); print(next(f["digests"]["sha256"] for f in d["urls"] if f["packagetype"] == "sdist"))')"
          url="$(curl -sf "https://pypi.org/pypi/openproject-ce-mcp/${{ steps.previous.outputs.previous_version }}/json" \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); print(next(f["url"] for f in d["urls"] if f["packagetype"] == "sdist"))')"
          sed -i '' "s|^  url \".*\"|  url \"$url\"|" "$local_tap_formula"
          sed -i '' "s|^  sha256 \".*\"|  sha256 \"$sha256\"|" "$local_tap_formula"
          brew install --build-from-source jtauschl/local-ci-tap/openproject-ce-mcp
          installed="$(openproject-ce-mcp --version)"
          echo "Installed baseline: $installed"

      - name: Upgrade to the current version
        run: |
          local_tap_formula="$(brew --repo jtauschl/local-ci-tap)/Formula/openproject-ce-mcp.rb"
          cp Formula/openproject-ce-mcp.rb "$local_tap_formula"
          brew upgrade --build-from-source jtauschl/local-ci-tap/openproject-ce-mcp

      - name: Verify the upgrade landed
        run: |
          out="$(openproject-ce-mcp --version)"
          echo "$out"
          echo "$out" | grep -qv "${{ steps.previous.outputs.previous_version }}"

      - name: Uninstall
        run: brew uninstall jtauschl/local-ci-tap/openproject-ce-mcp
